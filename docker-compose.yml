version: "3.8"

services:
  db:
    image: postgres:17
    container_name: teg-go-db
    environment:
      - POSTGRES_USER=teg
      - POSTGRES_PASSWORD=teg
      - POSTGRES_DB=teg
    ports:
      # Expuesto para desarrollo: el server local usa localhost:5440 por defecto
      - "5440:5432"
    volumes:
      - teg-go-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teg -d teg"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  teg-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teg-go-game
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STATIC_DIR=/app/public
      - DATABASE_URL=postgres://teg:teg@db:5432/teg?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  teg-go-db:
